name: RandomOPPVP
version: 1.1.0
main: org.kwonpop.randomOPPVP.RandomOPPVPPlugin
api-version: '1.21'
author: kwonpop
description: Random OP PVP minigame plugin
commands:
  랜덤op시작:
    description: 랜덤 OP PVP 게임을 시작합니다.
    permission: randomoppvp.admin
  랜덤op종료:
    description: 랜덤 OP PVP 게임을 종료합니다.
    permission: randomoppvp.admin
  킬타임시작:
    description: 킬 타임을 시작합니다.
    permission: randomoppvp.admin
  게임명령어:
    description: 게임 명령어를 표시합니다.
    permission: randomoppvp.admin
permissions:
  randomoppvp.admin:
    description: Random OP PVP 관리자 권한
    default: op
